<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width= , initial-scale=1.0">
    <title>Random Password Generator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="..." crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@1..144,1..1000&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h2>Random Password Generator</h2>

        <div class="input-box">
            <input type="text" id="psd-box" placeholder="Password..." readonly>
            <div class="icon-box">
                <i class="fa-regular fa-clone"></i>
            </div>
        </div>
        <div class="input-box">
            <input type="number" id="psd-length" placeholder="Password length">
        </div>
        <div class="generate-btn">
            <button>Generate</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
